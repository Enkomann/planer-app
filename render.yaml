services:
  - type: web
    name: luxmann-planner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: planner-documents
      mountPath: /opt/render/project/src/storage
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MAX_UPLOAD_MB
        value: 600
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ORS_API_KEY
        sync: false
